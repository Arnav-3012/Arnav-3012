<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Arnav Chaturvedi, AI / ML Engineer">
  <defs>
    <radialGradient id="glow" cx="85%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#7170ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7170ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08090a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#08090a" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="300" rx="14" fill="#08090a"/>
  <rect width="1000" height="300" rx="14" fill="url(#grid)"/>
  <rect width="1000" height="300" rx="14" fill="url(#glow)"/>
  <rect width="1000" height="300" rx="14" fill="url(#fade)" opacity="0.6"/>
  <rect x="0.5" y="0.5" width="999" height="299" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <rect x="60" y="48" width="226" height="26" rx="13" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1"/>
  <circle cx="78" cy="61" r="3.5" fill="#7170ff">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="92" y="65.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8a8f98" letter-spacing="0.4">NMIMS MPSTME  /  MUMBAI</text>

  <text x="58" y="148" font-family="Inter, 'SF Pro Display', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="60" font-weight="600" fill="#f7f8f8" letter-spacing="-2">Arnav Chaturvedi</text>
  <text x="60" y="182" font-family="Inter, 'SF Pro Display', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#8a8f98" letter-spacing="-0.2">AI / ML Engineer. RAG, agents and LLM systems.</text>

  <text x="60" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#7170ff" opacity="0">
    &gt; Production RAG at Credit Intelligence
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0.000;0.000;0.020;0.230;0.250;1.000" values="0;0;1;1;0;0"/>
  </text>
  <text x="60" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#7170ff" opacity="0">
    &gt; Agents, evals and cost-aware routing
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0.000;0.250;0.270;0.480;0.500;1.000" values="0;0;1;1;0;0"/>
  </text>
  <text x="60" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#7170ff" opacity="0">
    &gt; Training small LLMs from scratch on Apple silicon
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0.000;0.500;0.520;0.730;0.750;1.000" values="0;0;1;1;0;0"/>
  </text>
  <text x="60" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#7170ff" opacity="0">
    &gt; Targeting AI/ML engineering roles in Singapore and Australia
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0.000;0.750;0.770;0.980;1.000;1.000" values="0;0;1;1;0;0"/>
  </text>
  <rect x="60" y="244" width="9" height="2" fill="#7170ff" opacity="0.0"/>

  <line x1="60" y1="262" x2="940" y2="262" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="60" y="283" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#62666d" letter-spacing="1.2">PYTHON  .  PYTORCH  .  LANGGRAPH  .  FASTAPI  .  AWS</text>
  <text x="940" y="283" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#62666d" text-anchor="end" letter-spacing="1.2">arnavchat</text>
</svg>
